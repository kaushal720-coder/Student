<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1e3f">
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #0a1e3f;
    margin: 0;
    padding: 40px 20px;
  }
  .card {
    background: #12294f;
    max-width: 480px;
    margin: 0 auto 20px auto;
    padding: 32px;
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    color: #e8edf5;
  }
  h2 { margin-top: 0; color: #ffffff; }
  h3 { margin-top: 0; font-size: 17px; color: #ffffff; }
  .field {
    margin: 14px 0;
    font-size: 15px;
  }
  .label {
    font-weight: bold;
    color: #93a5c4;
    font-size: 12px;
    text-transform: uppercase;
    display: block;
    margin-bottom: 2px;
  }
  button {
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 14px;
    cursor: pointer;
    margin-right: 8px;
    margin-top: 10px;
  }
  .btn-logout { background: #dc2626; }
  .btn-logout:hover { background: #b91c1c; }
  .btn-present { background: #16a34a; }
  .btn-present:hover { background: #15803d; }
  .btn-absent { background: #6b7280; }
  .btn-absent:hover { background: #4b5563; }
  button:disabled {
    background: #3a4a63;
    cursor: not-allowed;
  }
  .streak-box {
    text-align: center;
    padding: 20px;
    background: #1b3a63;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .streak-number {
    font-size: 40px;
    font-weight: bold;
    color: #fb923c;
  }
  .streak-label {
    font-size: 13px;
    color: #cbd8ec;
    text-transform: uppercase;
  }
  .today-status {
    font-size: 14px;
    margin-top: 10px;
    color: #4ade80;
    font-weight: bold;
  }
  #loading, #error {
    text-align: center;
    margin-top: 40px;
    color: #e8edf5;
  }
  #error { color: #f87171; }

  .month-title {
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 14px;
    color: #ffffff;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 18px;
  }
  .day-cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
    background: #1b3a63;
    color: #e8edf5;
  }
  .day-cell.present { background: #16a34a; color: white; }
  .day-cell.absent { background: #dc2626; color: white; }
  .day-cell.empty { background: transparent; }
  .month-summary {
    display: flex;
    gap: 10px;
    margin-bottom: 4px;
  }
  .month-summary-box {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
  }
  .month-summary-box.present-box { background: #143d24; color: #4ade80; }
  .month-summary-box.absent-box { background: #4a1616; color: #f87171; }
  .month-summary-number { font-size: 20px; font-weight: bold; display: block; }
</style>
</head>
<body>

<div id="loading">Loading your data...</div>
<div id="error" style="display:none;"></div>

<div class="card" id="dashboardCard" style="display:none;">
  <h2>Welcome<span id="welcomeName"></span></h2>

  <div class="field">
    <span class="label">Email</span>
    <span id="fieldEmail"></span>
  </div>
  <div class="field">
    <span class="label">Full Name</span>
    <span id="fieldName"></span>
  </div>
  <div class="field">
    <span class="label">Seat No.</span>
    <span id="fieldSeatNo"></span>
  </div>
  <div class="field">
    <span class="label">Shift</span>
    <span id="fieldShift"></span>
  </div>
  <div class="field">
    <span class="label">Dues</span>
    <span id="fieldDues"></span>
  </div>
  <div class="field">
    <span class="label">Last Fees Paid</span>
    <span id="fieldLastFeesPaid"></span>
  </div>

  <button class="btn-logout" onclick="handleLogout()">Log Out</button>
</div>

<div class="card" id="attendanceCard" style="display:none;">
  <h3>Attendance</h3>

  <div class="streak-box">
    <div class="streak-number" id="streakCount">0</div>
    <div class="streak-label">Day Streak</div>
  </div>

  <div id="todayControls">
    <button class="btn-present" id="presentBtn" onclick="markAttendance('present')">Mark Present</button>
    <button class="btn-absent" id="absentBtn" onclick="markAttendance('absent')">Mark Absent</button>
  </div>
  <div class="today-status" id="todayStatus" style="display:none;"></div>
</div>

<div class="card" id="calendarCard" style="display:none;">
  <h3>This Month</h3>
  <div class="month-title" id="monthTitle"></div>

  <div class="month-summary">
    <div class="month-summary-box present-box">
      <span class="month-summary-number" id="monthPresentCount">0</span>
      Present
    </div>
    <div class="month-summary-box absent-box">
      <span class="month-summary-number" id="monthAbsentCount">0</span>
      Absent
    </div>
  </div>

  <div class="calendar-grid" id="calendarGrid"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://rpkungidlekhfggzxaae.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwa3VuZ2lkbGVraGZnZ3p4YWFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NjE1MjAsImV4cCI6MjEwNDMzNzUyMH0.sXO_jpCKh4FkImghr0lKXyz5rJfJthEvRY4v6_4zmtY";

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;

  function todayStr() {
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    return `${yyyy}-${mm}-${dd}`;
  }

  function shiftDate(dateStr, days) {
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + days);
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    return `${yyyy}-${mm}-${dd}`;
  }

  async function loadDashboard() {
    const { data: { user }, error: userError } = await supabaseClient.auth.getUser();

    if (userError || !user) {
      window.location.href = "login.html";
      return;
    }

    currentUser = user;

    const { data: student, error: studentError } = await supabaseClient
      .from("students")
      .select("*")
      .eq("user_id", user.id)
      .single();

    document.getElementById("loading").style.display = "none";

    if (studentError || !student) {
      document.getElementById("error").style.display = "block";
      document.getElementById("error").innerText = "Could not load your student record.";
      return;
    }

    document.getElementById("welcomeName").innerText = student.full_name ? ", " + student.full_name : "";
    document.getElementById("fieldEmail").innerText = student.email || "-";
    document.getElementById("fieldName").innerText = student.full_name || "-";
    document.getElementById("fieldSeatNo").innerText = student.seat_no || "-";
    document.getElementById("fieldShift").innerText = student.shift || "-";
    document.getElementById("fieldDues").innerText = (student.dues !== null && student.dues !== undefined) ? student.dues : "-";
    document.getElementById("fieldLastFeesPaid").innerText = student.last_fees_paid || "-";

    document.getElementById("dashboardCard").style.display = "block";
    document.getElementById("attendanceCard").style.display = "block";
    document.getElementById("calendarCard").style.display = "block";

    await loadAttendance();
  }

  async function loadAttendance() {
    const { data: records, error } = await supabaseClient
      .from("attendance")
      .select("attendance_date, status")
      .eq("user_id", currentUser.id)
      .order("attendance_date", { ascending: false });

    if (error) {
      console.error(error);
      return;
    }

    const today = todayStr();
    const todayRecord = records.find(r => r.attendance_date === today);

    if (todayRecord) {
      document.getElementById("todayControls").style.display = "none";
      const statusEl = document.getElementById("todayStatus");
      statusEl.style.display = "block";
      statusEl.innerText = todayRecord.status === "present"
        ? "You're marked Present today ✅"
        : "You're marked Absent today ❌";
      statusEl.style.color = todayRecord.status === "present" ? "#4ade80" : "#9ca3af";
    } else {
      document.getElementById("todayControls").style.display = "block";
      document.getElementById("todayStatus").style.display = "none";
    }

    const streak = calculateStreak(records, today);
    document.getElementById("streakCount").innerText = streak;

    renderMonthCalendar(records);
  }

  function calculateStreak(records, today) {
    const presentDates = new Set(
      records.filter(r => r.status === "present").map(r => r.attendance_date)
    );

    let streak = 0;
    let checkDate = presentDates.has(today) ? today : shiftDate(today, -1);

    while (presentDates.has(checkDate)) {
      streak++;
      checkDate = shiftDate(checkDate, -1);
    }

    return streak;
  }

  function renderMonthCalendar(records) {
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    document.getElementById("monthTitle").innerText = `${monthNames[month]} ${year}`;

    const statusByDate = {};
    records.forEach(r => { statusByDate[r.attendance_date] = r.status; });

    const firstDayOfMonth = new Date(year, month, 1);
    const startWeekday = firstDayOfMonth.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    for (let i = 0; i < startWeekday; i++) {
      const empty = document.createElement("div");
      empty.className = "day-cell empty";
      grid.appendChild(empty);
    }

    let presentCount = 0;
    let absentCount = 0;

    for (let day = 1; day <= daysInMonth; day++) {
      const mm = String(month + 1).padStart(2, "0");
      const dd = String(day).padStart(2, "0");
      const dateStr = `${year}-${mm}-${dd}`;

      const cell = document.createElement("div");
      cell.className = "day-cell";
      cell.innerText = day;

      const status = statusByDate[dateStr];
      if (status === "present") {
        cell.classList.add("present");
        presentCount++;
      } else if (status === "absent") {
        cell.classList.add("absent");
        absentCount++;
      }

      grid.appendChild(cell);
    }

    document.getElementById("monthPresentCount").innerText = presentCount;
    document.getElementById("monthAbsentCount").innerText = absentCount;
  }

  async function markAttendance(status) {
    document.getElementById("presentBtn").disabled = true;
    document.getElementById("absentBtn").disabled = true;

    const { error } = await supabaseClient
      .from("attendance")
      .insert({
        user_id: currentUser.id,
        attendance_date: todayStr(),
        status: status
      });

    if (error) {
      alert("Could not save attendance: " + error.message);
      document.getElementById("presentBtn").disabled = false;
      document.getElementById("absentBtn").disabled = false;
      return;
    }

    await loadAttendance();
  }

  async function handleLogout() {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
  }

  loadDashboard();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(console.error);
    });
  }
</script>
</body>
</html>
