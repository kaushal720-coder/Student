<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Champion Library - Student Login</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b2d5c">
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: linear-gradient(135deg, #0b2d5c 0%, #143d73 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: white;
    padding: 36px 32px;
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .logo {
    width: 90px;
    height: 90px;
    margin: 0 auto 14px auto;
    display: block;
    border-radius: 50%;
  }
  .institute-name {
    font-size: 22px;
    font-weight: bold;
    color: #0b2d5c;
    margin: 0;
    letter-spacing: 0.5px;
  }
  .tagline {
    font-size: 12px;
    color: #b8860b;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin: 4px 0 22px 0;
  }
  .divider {
    border: none;
    border-top: 1px solid #e5e0d0;
    margin: 0 0 20px 0;
  }
  h2 {
    font-family: Arial, sans-serif;
    font-size: 17px;
    color: #333;
    margin-bottom: 16px;
  }
  input {
    width: 100%;
    padding: 11px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    font-family: Arial, sans-serif;
  }
  input:focus {
    outline: none;
    border-color: #0b2d5c;
  }
  button {
    width: 100%;
    padding: 11px;
    margin-top: 12px;
    border: none;
    border-radius: 6px;
    background: #0b2d5c;
    color: white;
    font-size: 15px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  button:hover { background: #143d73; }
  .toggle {
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    font-family: Arial, sans-serif;
    color: #0b2d5c;
    cursor: pointer;
    text-decoration: underline;
  }
  #message {
    text-align: center;
    margin-top: 10px;
    font-size: 13px;
    font-family: Arial, sans-serif;
    color: #dc2626;
  }
  .footer-note {
    margin-top: 22px;
    font-size: 11px;
    font-family: Arial, sans-serif;
    color: #999;
  }
  #checkingSession {
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: #64748b;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<div class="card">
  <img class="logo" src="icon-192.png" alt="Champion Library Logo">
  <p class="institute-name">Champion Library</p>
  <p class="tagline">A Self Study Center</p>
  <hr class="divider">

  <p id="checkingSession">Checking login…</p>
  <div id="loginForm" style="display:none;">
  <h2 id="formTitle">Student Login</h2>

  <input type="text" id="fullName" placeholder="Full Name" style="display:none;">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button id="submitBtn" onclick="handleSubmit()">Log In</button>

  <div class="toggle" id="toggleText" onclick="toggleMode()">
    Don't have an account? Sign up
  </div>

  <div class="toggle" id="forgotPasswordLink" onclick="window.location.href='reset-request.html'" style="margin-top:6px;">
    Forgot password?
  </div>

  <div id="message"></div>
  </div>

  <p class="footer-note">© 2026 Champion Library. All rights reserved.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://rpkungidlekhfggzxaae.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwa3VuZ2lkbGVraGZnZ3p4YWFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NjE1MjAsImV4cCI6MjEwNDMzNzUyMH0.sXO_jpCKh4FkImghr0lKXyz5rJfJthEvRY4v6_4zmtY";

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      storage: window.localStorage
    }
  });

  let isSignup = false;

  (async function checkExistingSession() {
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session && session.user) {
        const { data: isAdmin } = await supabaseClient.rpc("is_admin");
        window.location.replace(isAdmin === true ? "admin.html" : "dashboard.html");
        return;
      }
    } catch (e) {}
    document.getElementById("checkingSession").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
  })();

  function toggleMode() {
    isSignup = !isSignup;
    document.getElementById("formTitle").innerText = isSignup ? "Student Sign Up" : "Student Login";
    document.getElementById("submitBtn").innerText = isSignup ? "Sign Up" : "Log In";
    document.getElementById("toggleText").innerText = isSignup
      ? "Already have an account? Log in"
      : "Don't have an account? Sign up";
    document.getElementById("fullName").style.display = isSignup ? "block" : "none";
    document.getElementById("forgotPasswordLink").style.display = isSignup ? "none" : "block";
    document.getElementById("message").innerText = "";
  }

  async function handleSubmit() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const fullName = document.getElementById("fullName").value.trim();
    const messageBox = document.getElementById("message");
    messageBox.style.color = "#dc2626";
    messageBox.innerText = "";

    if (!email || !password) {
      messageBox.innerText = "Please fill in all fields.";
      return;
    }

    if (isSignup) {
      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: { full_name: fullName }
        }
      });

      if (error) {
        messageBox.innerText = error.message;
      } else {
        messageBox.style.color = "#16a34a";
        messageBox.innerText = "Account created! You can now log in.";
        toggleMode();
      }
    } else {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        messageBox.innerText = error.message;
        return;
      }

      const { data: isAdmin, error: adminCheckError } = await supabaseClient.rpc("is_admin");

      if (!adminCheckError && isAdmin === true) {
        window.location.replace("admin.html");
      } else {
        window.location.replace("dashboard.html");
      }
    }
  }
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(console.error);
    });
  }
</script>
</body>
</html>
