<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Champion Library</title>
<script>
  // If this is a password recovery link (has an access_token/type=recovery in the hash),
  // forward to reset-password.html while keeping that hash intact.
  if (window.location.hash && window.location.hash.includes("type=recovery")) {
    window.location.replace("reset-password.html" + window.location.hash);
  } else {
    // Normal visit to the bare domain -> send to login page
    window.location.replace("login.html");
  }
</script>
</head>
<body>
  <p style="font-family: Arial, sans-serif; text-align:center; margin-top:40px;">Redirecting...</p>
</body>
</html>
