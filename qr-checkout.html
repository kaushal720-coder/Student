<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Out — Champion Library</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b2d5c">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(145deg, #0b2d5c 0%, #1e3a8a 40%, #c2410c 100%);
    color: #fff;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 24px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .icon {
    width: 88px; height: 88px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: linear-gradient(145deg, #fb923c, #ea580c);
    display: flex; align-items: center; justify-content: center;
    font-size: 42px;
    box-shadow: 0 8px 24px rgba(234,88,12,0.45);
  }
  .icon.error { background: linear-gradient(145deg, #f87171, #dc2626); box-shadow: 0 8px 24px rgba(220,38,38,0.4); }
  .icon.wait { background: linear-gradient(145deg, #a78bfa, #6d28d9); box-shadow: 0 8px 24px rgba(109,40,217,0.4); }
  h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; line-height: 1.25; }
  .sub { font-size: 15px; opacity: 0.9; line-height: 1.45; margin-bottom: 8px; }
  .name { font-size: 18px; font-weight: 700; color: #fde68a; margin: 10px 0 4px; }
  .time { font-size: 13px; opacity: 0.75; margin-top: 12px; }
  .btn {
    display: inline-block; margin-top: 22px; padding: 12px 22px;
    border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
    background: #fff; color: #0b2d5c; cursor: pointer; text-decoration: none;
  }
  .spinner {
    width: 36px; height: 36px; margin: 12px auto;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="icon wait" id="icon">⏳</div>
  <h1 id="title">Checking you out…</h1>
  <p class="sub" id="sub">Please wait</p>
  <div class="spinner" id="spinner"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://rpkungidlekhfggzxaae.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwa3VuZ2lkbGVraGZnZ3p4YWFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NjE1MjAsImV4cCI6MjEwNDMzNzUyMH0.sXO_jpCKh4FkImghr0lKXyz5rJfJthEvRY4v6_4zmtY";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, storage: window.localStorage }
  });

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  function show(state, title, sub, name) {
    const icon = document.getElementById("icon");
    const spinner = document.getElementById("spinner");
    document.getElementById("title").textContent = title;
    document.getElementById("sub").innerHTML = sub || "";
    spinner.style.display = state === "wait" ? "block" : "none";
    icon.className = "icon " + (state === "ok" ? "" : state === "error" ? "error" : "wait");
    icon.textContent = state === "ok" ? "👋" : state === "error" ? "⚠️" : "⏳";
    if (name) {
      document.getElementById("sub").innerHTML =
        `<div class="name">${name}</div>` + (sub || "");
    }
  }

  function addDashboardBtn() {
    const a = document.createElement("a");
    a.href = "dashboard.html";
    a.className = "btn";
    a.textContent = "Open Dashboard";
    document.getElementById("card").appendChild(a);
  }

  async function run() {
    const returnTo = location.href;
    let session = null;
    try {
      const { data } = await supabaseClient.auth.getSession();
      session = data.session;
    } catch (e) {}

    if (!session || !session.user) {
      show("error", "Please log in first", "You will be sent to login, then check-out will continue.");
      setTimeout(() => {
        location.replace("login.html?next=" + encodeURIComponent(returnTo));
      }, 1200);
      return;
    }

    const user = session.user;
    let displayName = user.user_metadata && user.user_metadata.full_name
      ? user.user_metadata.full_name
      : (user.email || "Student");

    try {
      const { data: student } = await supabaseClient
        .from("students")
        .select("full_name")
        .eq("user_id", user.id)
        .maybeSingle();
      if (student && student.full_name) displayName = student.full_name;
    } catch (e) {}

    const today = todayStr();
    const { data: existing } = await supabaseClient
      .from("attendance")
      .select("check_in_time, check_out_time, status")
      .eq("user_id", user.id)
      .eq("attendance_date", today)
      .maybeSingle();

    if (!existing || !existing.check_in_time) {
      show("error", "Not checked in",
        "No check-in found for today. Please scan the Check-In QR first.",
        displayName);
      addDashboardBtn();
      return;
    }

    if (existing.check_out_time) {
      show("ok", "Thank you, visit again!",
        "You already checked out today.<br><span class='time'>At " +
        new Date(existing.check_out_time).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) + "</span>",
        displayName);
      addDashboardBtn();
      return;
    }

    const outTime = new Date().toISOString();
    const { error } = await supabaseClient
      .from("attendance")
      .update({ check_out_time: outTime })
      .eq("user_id", user.id)
      .eq("attendance_date", today);

    if (error) {
      show("error", "Could not check out", error.message);
      addDashboardBtn();
      return;
    }

    // Study duration
    let studyNote = "";
    try {
      const mins = Math.floor((new Date(outTime) - new Date(existing.check_in_time)) / 60000);
      if (mins > 0) {
        const h = Math.floor(mins / 60), m = mins % 60;
        studyNote = "<br><span class='time'>Study time: " + (h ? h + "h " : "") + m + "m</span>";
      }
    } catch (e) {}

    show("ok", "Thank you, visit again!",
      "Checked out successfully." + studyNote +
      "<br><span class='time'>" + new Date(outTime).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) + "</span>",
      displayName);
    addDashboardBtn();
  }

  run();
</script>
</body>
</html>
